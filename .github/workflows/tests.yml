name: Tests

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install package
        run: python -m pip install -e . coverage

      - name: Prepare local SSH server and key
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo service ssh start
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o StrictHostKeyChecking=no localhost 'echo localhost ssh ok'

      - name: Run tests with coverage
        run: python -m coverage run -m unittest tests.test_job tests.test_node tests.test_templates tests.test_workflow tests.test_remote_reuse

      - name: Print coverage report
        run: python -m coverage report
